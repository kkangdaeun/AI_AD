<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>광고 슬라이드 + 사용자 선호도</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: black;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
    }

    .slider-container {
      height: 80%;
      overflow: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .arrow-btn-group {
      position: static; /* absolute → static */
      display: flex;
      justify-content: center;
      gap: 48px;
      margin: 24px 0 0 0; /* 위쪽 여백 필요시 조정 */
      z-index: 10;
    }

    .arrow-btn {
      position: static; /* 그룹 내에서 static으로 변경 */
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: rgba(30,30,30,0.7);
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .arrow-btn.left {
      left: 40px;
    }
    .arrow-btn.right {
      right: 40px;
    }
    .arrow-btn:hover {
      background: rgba(76,175,80,0.9);
    }

    .video-wrapper {
      display: flex;
      width: 100%;
      max-width: 900px;
      height: 100%;
      transition: transform 0.5s ease-in-out;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
      visibility: hidden;
    }

    .preference-panel {
      height: 20vh;
      background: #111;
      padding: 10px;
      box-sizing: border-box;
    }

    .preference-panel h3 {
      margin: 0 0 6px;
      font-size: 1rem;
    }

    .preference-bars {
      display: flex;
      height: calc(100% - 30px);
      align-items: flex-end;
    }

    .bar span {
      display: block;
      padding: 2px 0;
    }

    /* ─────────────────────────
   누적 막대그래프 컨테이너
   ───────────────────────── */
.progress-container {
  margin-top: 35px;      /* 위쪽에 20px 여백 */
  padding: 0 50px;       /* 좌우 20px 여백 */
  display: flex;         /* 내부 막대를 Flex로 세로 정렬 */
  flex-direction: column;
  gap: 10px;             /* 막대 사이 간격 10px */
}

/* ─────────────────────────
   막대 하나(배경 + 둥근 모서리)
   ───────────────────────── */
.progress-bar {
  position: relative;    /* 내부 요소(.fill, .remaining) 위치 기준 */
  width: 100%;           /* 가로 꽉 채우기 */
  height: 60px;          /* 막대 높이 */
  display: flex;         /* fill, remaining을 좌우로 배치 */
  border-radius: 4px;    /* 둥근 모서리 */
  overflow: hidden;      /* 둥근 모서리 밖으로 넘치는 부분 자르기 */
  background-color: #ccc;/* 기본 배경(빈 영역) */
  font-weight: bold;     /* 텍스트 굵게 */
  font-size: 14px;       /* 텍스트 크기 */
}

/* ─────────────────────────
   채워진 구간(왼쪽 노란색)
   ───────────────────────── */
.progress-fill {
  background-color: gold;/* 시청한 부분 색 */
  color: white;          /* 텍스트 색상 */
  text-align: center;    /* 텍스트 가운데 정렬 */
  line-height: 30px;     /* 텍스트 세로 가운데 (막대 높이와 동일) */
  height: 100%;          /* 막대 높이 전부 사용 */
  z-index: 2;            /* 회색 영역보다 위에 표시 */
  position: relative;    /* (필요할 때 추가 조정용) */
}

/* ─────────────────────────
   남은 구간(오른쪽 회색)
   flex-grow: 1 덕분에 fill이
   차지하고 남은 공간을 자동으로 먹음
   ───────────────────────── */
.progress-remaining {
  flex-grow: 1;          /* 남은 공간 전부 차지 */
  background-color: #999;/* 남은 부분 색 */
  color: white;          /* 텍스트 색상 */
  text-align: right;     /* 텍스트 오른쪽 정렬 */
  line-height: 30px;     /* 세로 가운데 */
  padding-right: 8px;    /* 우측 8px 안쪽 여백 */
  z-index: 1;            /* fill보다 한 단계 아래 (겹칠 일 거의 없음) */
}

  </style>
</head>
<body>

<div class="slider-container">
  <div id="videoWrapper" class="video-wrapper">
    <video id="video0" muted playsinline preload="auto"></video>
    <video id="video1" muted playsinline preload="auto"></video>
    <video id="video2" muted playsinline preload="auto"></video>
  </div>
</div>
<div class="arrow-btn-group">
  <button id="leftBtn" class="arrow-btn left">←</button>
  <button id="rightBtn" class="arrow-btn right">→</button>
</div>


    <div class="preference-panel">
    <h3>시청 시간 확인용</h3>
    <div id="preferenceBars" class="preference-bars"></div>
  </div>
  <div id="watchTime" style="color:#fff; text-align:center; margin:10px 0;"></div>

    <div class="progress-container">
    <div class="progress-bar">
      <div class="progress-fill" style="width: 70%;">70%</div>
      <div class="progress-remaining">30%</div>
    </div>
  </div>

  <input type="file" id="csvInput" accept=".csv" style="margin:20px;"/>

<script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
<script>
/* 파일 업로드 CSV 처리(사용자 수동) */
document.getElementById('csvInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(event) {
    const text = event.target.result;
    const lines = text.split(/\r?\n/).filter(line => line.trim());
    const headers = lines[0].split(',');
    const idxSec = headers.indexOf('광고소재초수');
    const idxUrl = headers.indexOf('AISAC_URL');
    if (idxSec === -1 || idxUrl === -1) {
      alert('필요한 열이 없습니다.');
      return;
    }
    const result = [];
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',');
      if (cols.length < Math.max(idxSec, idxUrl) + 1) continue;
      result.push({
        광고소재초수: cols[idxSec],
        AISAC_URL: cols[idxUrl]
      });
    }
    console.log(result);
    alert('CSV 로드 완료! 콘솔을 확인하세요.');
    // 👇 광고 URL 수동 변경(테스트용)
    // adUrls = result.map(row => row.AISAC_URL);
    // currentIndex = 0;
    // prepareVideos();
    // playCenterVideo();
  };
  reader.readAsText(file, 'utf-8');
});

/* 👇 광고 URL 배열: WebSocket 신호로 동적 갱신 */
let adUrls = []; // 광고 URL 대기열
let adRows = []; // 행 번호 대기열

let currentIndex = 0;
const wrapper = document.getElementById("videoWrapper");
const videoEls = [
  document.getElementById("video0"),
  document.getElementById("video1"),
  document.getElementById("video2")
];

function getIndex(offset) {
  return (currentIndex + offset + adUrls.length) % adUrls.length;
}
function preloadVideo(videoEl, url) {
  videoEl.style.visibility = "hidden";
  videoEl.src = url;
  videoEl.load();
  videoEl.onloadeddata = () => {
    videoEl.style.visibility = "visible";
  };
}
function prepareVideos() {
  if (!adUrls.length) return;
  preloadVideo(videoEls[0], adUrls[getIndex(-1)]);
  preloadVideo(videoEls[1], adUrls[getIndex(0)]);
  preloadVideo(videoEls[2], adUrls[getIndex(1)]);
  wrapper.style.transition = "none";
  wrapper.style.transform = "translateX(-100%)";
}
function playCenterVideo() {
  if (!adUrls.length) return;
  const center = videoEls[1];
  center.pause();
  center.currentTime = 0;
  center.play();
  videoStartTime = Date.now();
  center.onended = () => slideToNext();
}
function rotateVideos(direction) {
  if (direction === "next") {
    const temp = videoEls.shift();
    videoEls.push(temp);
  } else {
    const temp = videoEls.pop();
    videoEls.unshift(temp);
  }
  videoEls.forEach(v => wrapper.appendChild(v));
  prepareVideos();
  playCenterVideo();
}
let isTransitioning = false;
document.getElementById("leftBtn").addEventListener("click", slideToPrev);
document.getElementById("rightBtn").addEventListener("click", slideToNext);

// WebSocket 연결
// const ws = new WebSocket("ws://localhost:5000/ws");
// 
// 영상이 끝났을 때(또는 다음 영상 버튼을 눌렀을 때) 시청 시간(sec) 전송
// function sendWatchTime(sec) {
//     ws.send(JSON.stringify({type: "watch_time", sec: sec}));
// }

let videoStartTime = null;
let lastWatchSec = 0;
function updateWatchTime(sec) {
    lastWatchSec = sec;
    const row = adRows[getIndex(0)]; // 현재 광고의 행 번호
    document.getElementById("watchTime").textContent = `${row} 영상 시청 시간: ${sec}초`;
    if (typeof socket !== 'undefined' && socket.connected) {
        socket.emit("watch_time", { sec: sec, row: row });
    }
}
function slideToNext() {
  if (isTransitioning) return;
  if (videoStartTime) {
    const watchedMs = Date.now() - videoStartTime;
    const watchedSec = (watchedMs / 1000).toFixed(1);
    updateWatchTime(watchedSec);
    videoStartTime = null;
  }
  isTransitioning = true;
  wrapper.style.transition = "transform 0.5s ease-in-out";
  wrapper.style.transform = "translateX(-200%)";
  setTimeout(() => {
    currentIndex = getIndex(1);
    rotateVideos("next");
    isTransitioning = false;
  }, 500);
}
function slideToPrev() {
  if (isTransitioning) return;
  isTransitioning = true;
  wrapper.style.transition = "transform 0.5s ease-in-out";
  wrapper.style.transform = "translateX(0%)";
  setTimeout(() => {
    currentIndex = getIndex(-1);
    rotateVideos("prev");
    isTransitioning = false;
  }, 500);
}
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") slideToNext();
  else if (e.key === "ArrowLeft") slideToPrev();
});

// 마우스 드래그 지원
let dragStartX = null;
let dragging = false;
wrapper.addEventListener("mousedown", (e) => {
  if (isTransitioning) return;
  dragging = true;
  dragStartX = e.clientX;
  wrapper.style.transition = "none";
});
document.addEventListener("mousemove", (e) => {
  if (!dragging) return;
  const deltaX = e.clientX - dragStartX;
  wrapper.style.transform = `translateX(calc(-100% + ${deltaX}px))`;
});
document.addEventListener("mouseup", (e) => {
  if (!dragging) return;
  dragging = false;
  const deltaX = e.clientX - dragStartX;
  const threshold = wrapper.offsetWidth / 4;
  if (deltaX < -threshold) {
    slideToNext();
  } else if (deltaX > threshold) {
    slideToPrev();
  } else {
    wrapper.style.transition = "transform 0.3s";
    wrapper.style.transform = "translateX(-100%)";
  }
});

// WebSocket: 서버에서 광고 URL 배열 동적 수신!
const socket = io();
socket.on('connect', () => {
  console.log('WebSocket 연결됨');
});
socket.on('ads_urls', (data) => {
  if (data.ads && Array.isArray(data.ads) && data.ads.length > 0) {
    adUrls = data.ads.map(ad => ad.AISAC_URL);
    adRows = data.ads.map(ad => ad['행 번호']);
    currentIndex = 0;
    prepareVideos();
    playCenterVideo();
    console.log('서버에서 광고 목록 갱신:', adUrls, adRows);
  }
});

// 페이지 로드시 최초 셋팅
prepareVideos();
playCenterVideo();

const barContainer = document.getElementById("preferenceBars");
samplePreferences.forEach(([cat, val]) => {
  const bar = document.createElement("div");
  bar.className = "bar";
  bar.style.height = `${val}%`;
  bar.innerHTML = `<span>${cat}</span><span>${val.toFixed(1)}%</span>`;
  barContainer.appendChild(bar);
});
</script>


</body>
</html>
