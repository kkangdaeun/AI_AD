<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>방송사 온에어 서비스</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root {
      --primary: #1976d2;
      --primary-light: #e3f2fd;
      --background: #f9f9f9;
      --surface: #fff;
      --border: #e0e0e0;
      --text: #222;
      --muted: #888;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
      --radius: 10px;
      --button-success: #28a745;
      --button-success-hover: #218838;
    }
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: var(--background);
        font-family: 'Roboto', Arial, sans-serif;
        color: var(--text);
    }
    body {
      min-height: 100vh;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      padding: 0 32px;
      height: 70px;
      box-shadow: var(--shadow);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .main-content {
      display: none; /* Initially hidden */
      justify-content: center;
      gap: 32px;
      max-width: 1400px;
      margin: 40px auto 0 auto;
      padding: 0 24px 40px 24px;
      }
    .center-content {
      flex: 1 1 700px;
      max-width: 900px;
      min-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0px;
    }
    .clock {
      font-size: 1.3rem;
      color: var(--muted);
      font-family: 'Montserrat';
      font-weight: 700;
      letter-spacing: 0px;
    }
    .slider-container {
      height: 80%;
      overflow: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .arrow-btn-group {
      position: static; /* absolute → static */
      display: flex;
      justify-content: center;
      gap: 48px;
      margin: 24px 0 0 0; /* 위쪽 여백 필요시 조정 */
      z-index: 10;
    }
    .arrow-btn {
      position: static; /* 그룹 내에서 static으로 변경 */
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: #1976d2;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .arrow-btn.left {
      left: 40px;
    }
    .arrow-btn.right {
      right: 40px;
    }
    .arrow-btn:hover {
      background: rgba(76,175,80,0.9);
    }
    .video-wrapper {
      display: flex;
      width: 100%;
      max-width: 900px;
      height: 100%;
      transition: transform 0.5s ease-in-out;
    }
    .video-player-container {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }
    .video-player {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-header-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.3));
      padding: 10px 20px;
      color: white;
      display: flex;
      align-items: center;
      box-sizing: border-box;
      z-index: 2;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
    }
    .video-controls-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.3)); /* 그라데이션 적용 */
      padding: 5px 15px; /* 높이 조절 (원래 10px 15px) */
      opacity: 1;
      transition: opacity 0.3s ease-in-out;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      color: white;
      box-sizing: border-box;
      z-index: 2; /* Ensure controls are above video */
    }
    .video-controls-container.hidden {
        opacity: 0;
        pointer-events: none; /* Disable interaction when hidden */
    }
    #header-video-title {
      font-size: 1rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-grow: 1;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
      visibility: visible;
    }
    .center-icon {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
      font-size: 64px;
      color: white;
      text-shadow: 0 0 15px rgba(0,0,0,0.7);
    }
    .center-icon.show {
      display: block;
      opacity: 1;
      animation: fadeOutIcon 1.2s forwards;
    }
    @keyframes fadeOutIcon {
      0% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; }
    }
    .preference-panel {
      height: 20vh;
      padding: 10px;
      box-sizing: border-box;
    }
    .preference-panel h3 {
      margin: 0 0 6px;
      font-size: 1rem;
    }
    .preference-bars {
      display: flex;
      height: calc(100% - 30px);
      align-items: flex-end;
    }
    .bar span {
      display: block;
      padding: 2px 0;
    }
    .preference-bars {
      display: flex;
      height: 40px;
      overflow: hidden;
      border-radius: 6px;
      font-family: sans-serif;
      margin-top: 6px;
    }

    .bar {
      white-space: nowrap;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius) var(--radius) 0 0;
      overflow: hidden;
    }

    .tabs label.tab {
      flex: 1;
      text-align: center;
      padding: 14px 0;
      font-size: 1rem;
      font-weight: 500;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
      border-radius: var(--radius) var(--radius) 0 0;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      position: relative;
      z-index: 1;
    }

    #tab-radio-playlist:checked ~ .tabs label[for="tab-radio-playlist"],
    #tab-radio-user:checked ~ .tabs label[for="tab-radio-user"],
    #tab-radio-ad:checked ~ .tabs label[for="tab-radio-ad"] {
      color: var(--primary);
      background: var(--primary-light);
      border-bottom: 2px solid var(--primary);
      z-index: 2;
    }

    .tab-content {
      background: var(--surface);
      border-radius: 0 0 var(--radius) var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 24px;
      font-size: 1rem;
      color: var(--text);
      min-height: 80px;
      margin-bottom: 16px;
    }

    .tab-content .tab-pane { display: none; }
    #tab-radio-playlist:checked ~ .tab-content .tab-pane-playlist,
    #tab-radio-user:checked ~ .tab-content .tab-pane-user,
    #tab-radio-ad:checked ~ .tab-content .tab-pane-ad {
      display: block;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.3s ease;
    }

    .modal-content {
      background: var(--surface);
      padding: 32px 40px;
      border-radius: var(--radius);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .modal-content h2 {
      margin-top: 0;
      margin-bottom: 12px;
      color: var(--primary);
      font-size: 1.8rem;
    }

    .modal-content p {
        margin-bottom: 24px;
        color: var(--muted);
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text);
    }

    .form-group select,
    .form-group input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      background: var(--background);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: var(--button-success);
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

  .submit-btn:hover {
      background: var(--button-success-hover);
  }
  #decline-privacy {
    cursor: pointer;
    color: var(--muted);
    font-size: 0.95rem;
    margin-top: 10px;
    transition: color 0.2s;
    user-select: none;
  }
.program-list-ul {

  </style>

<script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
<script>

  // 광고 표시 여부 (정규방송시간: false 기본값)
window.isAdActive = false; // 기본값

let wasAdActive = false;

function updatePlayerMode() {
  const adSlider = document.getElementById('ad-slider-player');
  const closingPlayer = document.getElementById('closing-player');
  const closingVideo = document.getElementById('closingVideo');
  const video0 = document.getElementById('video0');
  const video1 = document.getElementById('video1');
  const video2 = document.getElementById('video2');
  const leftBtn = document.getElementById('leftBtn');
  const rightBtn = document.getElementById('rightBtn');

  if (window.isAdActive) {
    adSlider.style.display = '';
    closingPlayer.style.display = 'none';
    if (closingVideo) closingVideo.pause();
    if (leftBtn) leftBtn.style.display = '';
    if (rightBtn) rightBtn.style.display = '';
    playCenterVideo();
  } else {
    let watchedMs = accumulatedWatchMs;
    if (videoStartTime) {
      watchedMs += Date.now() - videoStartTime;
      videoStartTime = null;
    }
    if (watchedMs > 0) {
      const watchedSec = (watchedMs / 1000).toFixed(1);
      updateWatchTime(watchedSec);
    }
    accumulatedWatchMs = 0;

    adSlider.style.display = 'none';
    closingPlayer.style.display = '';
    [video0, video1, video2].forEach(v => {
      if (v) {
        v.pause();
        v.currentTime = 0;
      }
    });

    if (closingVideo) {
      closingVideo.pause();
      closingVideo.currentTime = 0;

      // 광고 모드에서 넘어온 경우 opening-news로 변경
      if (wasAdActive && !window.isAdActive) {
        closingVideo.src = "http://gatgaem.foundryvtt.hknu.ac.kr/broadcast-program/opening-news.mp4";
        closingVideo.load();
      }

      // ✅ 광고처럼 명시적으로 재생 시도
      closingVideo.muted = false;      // 소리 활성화
      closingVideo.volume = 1.0;       // 볼륨 최대로
      closingVideo.play().catch(err => {
        console.warn("정규방송 재생 실패:", err);
      });
    }

    if (leftBtn) leftBtn.style.display = 'none';
    if (rightBtn) rightBtn.style.display = 'none';
  }

  wasAdActive = window.isAdActive; // 상태 업데이트
}

/* 👇 광고 URL 배열: WebSocket 신호로 동적 갱신 */
let adUrls = []; // 광고 URL 대기열
let adRows = []; // 행 번호 대기열

let currentIndex = 0;
const wrapper = document.getElementById("videoWrapper");
const videoEls = [
  document.getElementById("video0"),
  document.getElementById("video1"),
  document.getElementById("video2")
];

function getIndex(offset) {
  return (currentIndex + offset + adUrls.length) % adUrls.length;
}
function preloadVideo(videoEl, url) {
  videoEl.style.visibility = "hidden";
  videoEl.src = url;
  videoEl.load();
  videoEl.onloadeddata = () => {
    videoEl.style.visibility = "visible";
  };
}
function prepareVideos() {
  if (!adUrls.length) return;
  preloadVideo(videoEls[0], adUrls[getIndex(-1)]);
  preloadVideo(videoEls[1], adUrls[getIndex(0)]);
  preloadVideo(videoEls[2], adUrls[getIndex(1)]);
  wrapper.style.transition = "none";
  wrapper.style.transform = "translateX(-100%)";
}

function showCenterIcon(type) {
  const iconWrap = document.getElementById("video-center-icon");
  const icon = document.getElementById("play-pause-icon");
  if (type === "play") {
    icon.className = "fas fa-play";
  } else {
    icon.className = "fas fa-pause";
  }
  iconWrap.classList.remove("show");
  void iconWrap.offsetWidth;
  iconWrap.style.display = "block";
  iconWrap.classList.add("show");
  setTimeout(() => {
    iconWrap.classList.remove("show");
    iconWrap.style.display = "none";
  }, 1200);
}

function togglePlayPause(e) {
  const video = e.currentTarget;
  if (video.paused) {
    videoStartTime = Date.now();
    video.play();
    showCenterIcon("play");
  } else {
    if (videoStartTime) {
      accumulatedWatchMs += Date.now() - videoStartTime;
      videoStartTime = null;
    }
    video.pause();
    showCenterIcon("pause");
  }
}
// 2. playCenterVideo에서 removeEventListener로 먼저 제거 후 addEventListener
function playCenterVideo() {
  if (!adUrls.length) return;
  const center = videoEls[1];
  center.pause();
  center.currentTime = 0;
  accumulatedWatchMs = 0; // 새 영상 시작 시 누적 시간 초기화
  center.play();
  videoStartTime = Date.now();
  center.onended = () => slideToNext();

  // 기존 클릭 이벤트 제거 후 다시 등록 (중복 방지)
  center.removeEventListener("click", togglePlayPause);
  center.addEventListener("click", togglePlayPause);

  // 마우스 커서 포인터로 변경
  center.style.cursor = "pointer";
}
function rotateVideos(direction) {
  if (direction === "next") {
    const temp = videoEls.shift();
    videoEls.push(temp);
  } else {
    const temp = videoEls.pop();
    videoEls.unshift(temp);
  }
  videoEls.forEach(v => wrapper.appendChild(v));
  prepareVideos();
  playCenterVideo();
}
let isTransitioning = false;
document.getElementById("leftBtn").addEventListener("click", slideToPrev);
document.getElementById("rightBtn").addEventListener("click", slideToNext);

let videoStartTime = null;
let lastWatchSec = 0;
let accumulatedWatchMs = 0; // 누적 시청 시간(ms)
function updateWatchTime(sec) {
    lastWatchSec = sec;
    const row = adRows[getIndex(0)]; // 현재 광고의 행 번호
    document.getElementById("watchTime").textContent = `${row} 영상 시청 시간: ${sec}초`;
    if (typeof socket !== 'undefined' && socket.connected) {
        socket.emit("watch_time", { sec: sec, row: row });
    }
}


function slideToNext() {
  if (isTransitioning) return;
  let watchedMs = accumulatedWatchMs;
  if (videoStartTime) {
    watchedMs += Date.now() - videoStartTime;
    videoStartTime = null;
  }
  if (watchedMs > 0) {
    const watchedSec = (watchedMs / 1000).toFixed(1);
    updateWatchTime(watchedSec);
  }
  accumulatedWatchMs = 0;
  isTransitioning = true;
  wrapper.style.transition = "transform 0.5s ease-in-out";
  wrapper.style.transform = "translateX(-200%)";
  setTimeout(() => {
    currentIndex = getIndex(1);
    rotateVideos("next");
    isTransitioning = false;
  }, 500);
}

function slideToPrev() {
  if (isTransitioning) return;
  let watchedMs = accumulatedWatchMs;
  if (videoStartTime) {
    watchedMs += Date.now() - videoStartTime;
    videoStartTime = null;
  }
  if (watchedMs > 0) {
    const watchedSec = (watchedMs / 1000).toFixed(1);
    updateWatchTime(watchedSec);
  }
  accumulatedWatchMs = 0;
  isTransitioning = true;
  wrapper.style.transition = "transform 0.5s ease-in-out";
  wrapper.style.transform = "translateX(0%)";
  setTimeout(() => {
    currentIndex = getIndex(-1);
    rotateVideos("prev");
    isTransitioning = false;
  }, 500);
}

// 마우스 드래그 지원
let dragStartX = null;
let dragging = false;
wrapper.addEventListener("mousedown", (e) => {
  if (isTransitioning) return;
  dragging = true;
  dragStartX = e.clientX;
  wrapper.style.transition = "none";
});
document.addEventListener("mousemove", (e) => {
  if (!dragging) return;
  const deltaX = e.clientX - dragStartX;
  wrapper.style.transform = `translateX(calc(-100% + ${deltaX}px))`;
});
document.addEventListener("mouseup", (e) => {
  if (!dragging) return;
  dragging = false;
  const deltaX = e.clientX - dragStartX;
  const threshold = wrapper.offsetWidth / 4;
  if (deltaX < -threshold) {
    slideToNext();
  } else if (deltaX > threshold) {
    slideToPrev();
  } else {
    wrapper.style.transition = "transform 0.3s";
    wrapper.style.transform = "translateX(-100%)";
  }
});

// WebSocket: 서버에서 광고 URL 배열 동적 수신!
const socket = io();
socket.on('connect', () => {
  console.log('WebSocket 연결됨');
});
socket.on('ads_urls', (data) => {
  if (data.ads && Array.isArray(data.ads) && data.ads.length > 0) {
    adUrls = data.ads.map(ad => ad.AISAC_URL);
    adRows = data.ads.map(ad => ad['행 번호']);
    currentIndex = 0;
    prepareVideos();
    playCenterVideo();
    console.log('서버에서 광고 목록 갱신:', adUrls, adRows);

    // 광고 대기열 시각화 
    renderAdQueue();
  }

  // ★ mid_scores를 받아 그래프 그리기
  if (data.mid_scores && Array.isArray(data.mid_scores)) {
    const container = document.getElementById("preferenceBars");
    container.innerHTML = ""; // 기존 그래프 초기화

    const colors = ["#f4c542", "#6aa84f", "#3c78d8", "#e06666", "#b0b0b0", "#f78da7"];

    // ✅ 비율 기준 상위 10개만 추출
    const topScores = data.mid_scores
      .sort((a, b) => b["비율"] - a["비율"])
      .slice(0, 10);

    topScores.forEach((score, i) => {
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.style.width = `${score["비율"]}%`;
      bar.style.height = "100%";
      bar.style.background = colors[i % colors.length];
      bar.style.display = "flex";
      bar.style.flexDirection = "column";
      bar.style.justifyContent = "center";
      bar.style.alignItems = "center";
      bar.style.fontSize = "0.75rem";
      bar.style.fontWeight = "bold";
      bar.style.color = "#fff";
      bar.title = score["중업종 분류"];

      bar.innerHTML = `
        <div>${score["중업종 분류"]}</div>
        <div>${score["비율"].toFixed(1)}%</div>
      `;

      container.appendChild(bar);
      });
    }

  });

// 광고 대기열을 시각적으로 표시하는 함수 추가
function renderAdQueue() {
  const adQueueList = document.getElementById('ad-queue-list');
  if (!adQueueList) return;
  adQueueList.innerHTML = '';
  adUrls.forEach((url, idx) => {
    const li = document.createElement('li');
    li.innerHTML = `<b>광고 ID:</b> ${adRows[idx]}<br><span style="font-size:0.9em;color:#888;">${url}</span>`;
    adQueueList.appendChild(li);
  });
}
// 광고대기열 탭 클릭 시에도 광고 대기열을 다시 렌더링
document.querySelector('label[for="tab-radio-ad"]').addEventListener('click', () => {
  renderAdQueue();
});

document.addEventListener('DOMContentLoaded', () => {
  const closingVideo = document.getElementById('closingVideo');

  // 사용자가 처음 클릭하면 정규 방송 강제 재생 허용
  document.body.addEventListener('click', () => {
    if (closingVideo && closingVideo.paused) {
      closingVideo.muted = false;
      closingVideo.volume = 1.0;
      closingVideo.play().catch(err => {
        console.warn("🎬 정규방송 재생 실패:", err);
      });
    }
  }, { once: true });

  updatePlayerMode(); // 초기 상태 반영

  // 이하: 사용자 설정 / 개인정보 모달 처리
  const modal = document.getElementById('user-info-modal');
  const form = document.getElementById('user-info-form');
  const mainContent = document.querySelector('.main-content');
  const declinePrivacy = document.getElementById('decline-privacy');

  declinePrivacy.addEventListener('click', () => {
    modal.style.display = 'none';
    mainContent.style.display = 'flex';
    socket.emit('request_ads');
  });

  socket.emit('check_user_config');
  socket.on('user_config_exists', (data) => {
    if (data.exists) {
      modal.style.display = 'none';
      mainContent.style.display = 'flex';
      socket.emit('request_ads');
    } else {
      modal.style.display = 'flex';
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const gender = document.getElementById('gender').value;
    const age = document.getElementById('age').value;
    if (gender && age) {
      if (typeof socket !== 'undefined' && socket.connected) {
        socket.emit('user_info', { gender, age });
        socket.emit('request_ads');
      }
      modal.style.display = 'none';
      mainContent.style.display = 'flex';
    }
  });
  // 개발자 테스트용 가짜 시계 시작 (19:34:40)
  let devClock = new Date();
  devClock.setHours(19);
  devClock.setMinutes(34);
  devClock.setSeconds(43);

  setInterval(() => {
    devClock.setSeconds(devClock.getSeconds() + 1);

    const hh = devClock.getHours().toString().padStart(2, '0');
    const mm = devClock.getMinutes().toString().padStart(2, '0');
    const ss = devClock.getSeconds().toString().padStart(2, '0');
    document.getElementById('clock').textContent = `${hh}:${mm}:${ss}`;

    const totalSec = hh * 3600 + mm * 60 + Number(ss);

    const playClosingStart = 19 * 3600 + 34 * 60 + 44; // 19:34:44
    const playClosingEnd   = 19 * 3600 + 34 * 60 + 59; // 19:34:59
    const startAd          = 19 * 3600 + 35 * 60; // 19:35:00
    const endAd            = 19 * 3600 + 36 * 60;      // 19:36:00

    const was = window.isAdActive;
    window.isAdActive = (totalSec >= startAd && totalSec < endAd);

    if (window.isAdActive !== was) {
      updatePlayerMode();
      console.log(`⏱ ${hh}:${mm}:${ss} → 광고 모드: ${window.isAdActive}`);
    }
  }, 1000);

  const schedule = [
    { title: "하이킥", start: "19:34:44", end: "19:34:59" },
    { title: "광고",   start: "19:35:00", end: "19:35:59" },
    { title: "뉴스",   start: "19:36:00", end: "19:36:14" }
  ];

  function parseTime(str) {
    const [h, m, s] = str.split(":").map(Number);
    const t = new Date();
    t.setHours(h, m, s, 0);
    return t.getTime();
  }

  function getCurrentProgramIndex() {
    const now = devClock.getTime();
    for (let i = 0; i < schedule.length; i++) {
      const s = parseTime(schedule[i].start);
      const e = parseTime(schedule[i].end);
      if (now >= s && now < e) return i;
    }
    return -1;
  }

  function renderProgramSchedule() {
    const ul = document.getElementById("playlist-ul");
    if (!ul) return;
    ul.innerHTML = "";

    const current = getCurrentProgramIndex();

    schedule.forEach((program, i) => {
      const li = document.createElement("li");
      if (i === current) li.classList.add("active");

      li.innerHTML = `
        <div class="title">${program.title}</div>
        <div class="time">${program.start} ~ ${program.end}</div>
        ${i === current ? '<div class="badge">시청중</div>' : ""}
      `;
      ul.appendChild(li);
    });
  }

  // 최초 렌더링 + 1초마다 갱신
  renderProgramSchedule();
  setInterval(renderProgramSchedule, 1000);

});
</script>
