<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>방송사 온에어 서비스</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root {
      --primary: #1976d2;
      --primary-light: #e3f2fd;
      --background: #f9f9f9;
      --surface: #fff;
      --border: #e0e0e0;
      --text: #222;
      --muted: #888;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
      --radius: 10px;
      --button-success: #28a745;
      --button-success-hover: #218838;
    }
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: var(--background);
        font-family: 'Roboto', Arial, sans-serif;
        color: var(--text);
    }
    body {
      min-height: 100vh;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      padding: 0 32px;
      height: 70px;
      box-shadow: var(--shadow);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .main-content {
      display: none; /* Initially hidden */
      justify-content: center;
      gap: 32px;
      max-width: 1400px;
      margin: 40px auto 0 auto;
      padding: 0 24px 40px 24px;
      }
    .center-content {
      flex: 1 1 700px;
      max-width: 900px;
      min-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0px;
    }
    .clock {
      font-size: 1.3rem;
      color: var(--muted);
      font-family: 'Montserrat';
      font-weight: 700;
      letter-spacing: 0px;
    }
    .slider-container {
      height: 80%;
      overflow: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .arrow-btn-group {
      position: static; /* absolute → static */
      display: flex;
      justify-content: center;
      gap: 48px;
      margin: 24px 0 0 0; /* 위쪽 여백 필요시 조정 */
      z-index: 10;
    }
    .arrow-btn {
      position: static; /* 그룹 내에서 static으로 변경 */
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: #1976d2;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .arrow-btn.left {
      left: 40px;
    }
    .arrow-btn.right {
      right: 40px;
    }
    .arrow-btn:hover {
      background: rgba(76,175,80,0.9);
    }
    .video-wrapper {
      display: flex;
      width: 100%;
      max-width: 900px;
      height: 100%;
      transition: transform 0.5s ease-in-out;
    }
    .video-player-container {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }
    .video-player {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-header-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.3));
      padding: 10px 20px;
      color: white;
      display: flex;
      align-items: center;
      box-sizing: border-box;
      z-index: 2;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
    }
    .video-controls-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.3)); /* 그라데이션 적용 */
      padding: 5px 15px; /* 높이 조절 (원래 10px 15px) */
      opacity: 1;
      transition: opacity 0.3s ease-in-out;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      color: white;
      box-sizing: border-box;
      z-index: 2; /* Ensure controls are above video */
    }
    .video-controls-container.hidden {
        opacity: 0;
        pointer-events: none; /* Disable interaction when hidden */
    }
    #header-video-title {
      font-size: 1rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-grow: 1;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
      visibility: hidden;
    }
    .center-icon {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
      font-size: 64px;
      color: white;
      text-shadow: 0 0 15px rgba(0,0,0,0.7);
    }
    .center-icon.show {
      display: block;
      opacity: 1;
      animation: fadeOutIcon 1.2s forwards;
    }
    @keyframes fadeOutIcon {
      0% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; }
    }
    .preference-panel {
      height: 20vh;
      padding: 10px;
      box-sizing: border-box;
    }
    .preference-panel h3 {
      margin: 0 0 6px;
      font-size: 1rem;
    }
    .preference-bars {
      display: flex;
      height: calc(100% - 30px);
      align-items: flex-end;
    }
    .bar span {
      display: block;
      padding: 2px 0;
    }
    .preference-bars {
      display: flex;
      height: 40px;
      overflow: hidden;
      border-radius: 6px;
      font-family: sans-serif;
      margin-top: 6px;
    }

    .bar {
      white-space: nowrap;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius) var(--radius) 0 0;
      overflow: hidden;
    }

    .tabs label.tab {
      flex: 1;
      text-align: center;
      padding: 14px 0;
      font-size: 1rem;
      font-weight: 500;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
      border-radius: var(--radius) var(--radius) 0 0;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      position: relative;
      z-index: 1;
    }

    #tab-radio-playlist:checked ~ .tabs label[for="tab-radio-playlist"],
    #tab-radio-user:checked ~ .tabs label[for="tab-radio-user"],
    #tab-radio-ad:checked ~ .tabs label[for="tab-radio-ad"] {
      color: var(--primary);
      background: var(--primary-light);
      border-bottom: 2px solid var(--primary);
      z-index: 2;
    }

    .tab-content {
      background: var(--surface);
      border-radius: 0 0 var(--radius) var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 24px;
      font-size: 1rem;
      color: var(--text);
      min-height: 80px;
      margin-bottom: 16px;
    }

    .tab-content .tab-pane { display: none; }
    #tab-radio-playlist:checked ~ .tab-content .tab-pane-playlist,
    #tab-radio-user:checked ~ .tab-content .tab-pane-user,
    #tab-radio-ad:checked ~ .tab-content .tab-pane-ad {
      display: block;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.3s ease;
    }

    .modal-content {
      background: var(--surface);
      padding: 32px 40px;
      border-radius: var(--radius);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .modal-content h2 {
      margin-top: 0;
      margin-bottom: 12px;
      color: var(--primary);
      font-size: 1.8rem;
    }

    .modal-content p {
        margin-bottom: 24px;
        color: var(--muted);
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text);
    }

    .form-group select,
    .form-group input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      background: var(--background);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: var(--button-success);
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

  .submit-btn:hover {
      background: var(--button-success-hover);
  }
  #decline-privacy {
    cursor: pointer;
    color: var(--muted);
    font-size: 0.95rem;
    margin-top: 10px;
    transition: color 0.2s;
    user-select: none;
  }

  </style>
</head>
<body>
    <div id="user-info-modal" class="modal-overlay">
      <div class="modal-content">
        <h2>사용자 정보 입력</h2>
        <p>성별과 연령 정보는 사용자 군집화에 사용되고 있어요</p>
        <form id="user-info-form">
          <div class="form-group">
            <label for="gender">성별</label>
            <select id="gender" name="gender" required>
              <option value="">성별을 입력하세요</option>
              <option value="male">남성</option>
              <option value="female">여성</option>
            </select>
          </div>
          <div class="form-group">
            <label for="age">연령</label>
            <input type="number" id="age" name="age" min="1" max="120" required placeholder="나이를 입력하세요">
          </div>
          <p>입력하신 개인 정보는 로컬 파일에 저장될 예정이에요</p>
          <button type="submit" class="submit-btn">시작하기</button>
          <p id="decline-privacy">아니요, <u>개인정보 제공에 동의하지 않아요</u></p>
        </form>
      </div>
    </div>

    <header class="header">
        <div class="logo">방송사 온에어 서비스</div>
        <div class="header-right">
            <div class="clock" id="clock"></div>
        </div>
    </header>
    
  <main class="main-content">
    <section class="center-content">
      <div class="video-player-container">
        <div class="video-player" id="video-player-wrapper">
          <!-- 기존 슬라이드용 video-wrapper를 이 안에 넣음 -->
          <div class="video-header-bar">
            <span id="header-video-title">LIVE</span>
          </div>
            <div id="videoWrapper" class="video-wrapper">
              <video id="video0" playsinline preload="auto"></video>
              <video id="video1" playsinline preload="auto"></video>
              <video id="video2" playsinline preload="auto"></video>
            </div>
            <div id="video-center-icon" class="center-icon" style="display:none;">
                <i id="play-pause-icon" class="fas fa-play"></i>
            </div>
          <!-- 커스텀 컨트롤 영역 (기본은 숨김 처리) -->
          <div class="video-controls-container" id="custom-controls" style="display:none;">
            <!-- 필요시 커스텀 컨트롤 버튼 추가 -->
          </div>
        </div>
      </div>
      <div class="arrow-btn-group">
        <button id="leftBtn" class="arrow-btn left">←</button>
        <button id="rightBtn" class="arrow-btn right">→</button>
      </div>
      <div class="tabs-container">
  <input type="radio" id="tab-radio-playlist" name="tab-radio" checked hidden>
  <input type="radio" id="tab-radio-user" name="tab-radio" hidden>
  <input type="radio" id="tab-radio-ad" name="tab-radio" hidden>

  <div class="tabs">
    <label class="tab" for="tab-radio-playlist">편성표</label>
    <label class="tab" for="tab-radio-user">사용자 선호도</label>
    <label class="tab" for="tab-radio-ad">광고대기열</label>
  </div>
  <div class="tab-content">
    <div class="tab-pane tab-pane-playlist">
      <!-- 편성표 내용 -->
      <div class="program-list" id="program-list-content">
        <h4>편성 프로그램 목록</h4>
        <div class="program-list-ul-wrapper">
          <ul id="playlist-ul"></ul>
        </div>
        <div class="pagination" id="pagination-controls"></div>
      </div>
    </div>
    <div class="tab-pane tab-pane-user">
      <h4>사용자 선호도 기반 추천</h4>
      <p>업종별 광고 시청 비율:</p>
      <div class="preference-panel">
        <div id="preferenceBars" class="preference-bars"></div>
      </div>
      <div id="watchTime" style="text-align:center; margin:10px 0;"></div>
      <p style="color:var(--muted); font-size:0.9rem;">위 데이터는 사용자의 시청 기록을 기반으로 합니다.</p>
    </div>
    <div class="tab-pane tab-pane-ad">
      <h4>광고 대기열 정보</h4>
      <p>현재 준비 중인 광고 목록입니다:</p>
      <ul id="ad-queue-list"></ul>
      <p style="color:var(--muted); font-size:0.9rem;">집행 예정 광고 대기열입니다.</p>
    </div>
  </div>
</div>

      <!-- <div class="preference-panel">
        <h3>시청 시간 확인용</h3>
        <div id="preferenceBars" class="preference-bars"></div>
      </div>
      <div id="watchTime" style="text-align:center; margin:10px 0;"></div> -->
    </section>
  </main>

<script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
<script>

/* 👇 광고 URL 배열: WebSocket 신호로 동적 갱신 */
let adUrls = []; // 광고 URL 대기열
let adRows = []; // 행 번호 대기열

let currentIndex = 0;
const wrapper = document.getElementById("videoWrapper");
const videoEls = [
  document.getElementById("video0"),
  document.getElementById("video1"),
  document.getElementById("video2")
];

function getIndex(offset) {
  return (currentIndex + offset + adUrls.length) % adUrls.length;
}
function preloadVideo(videoEl, url) {
  videoEl.style.visibility = "hidden";
  videoEl.src = url;
  videoEl.load();
  videoEl.onloadeddata = () => {
    videoEl.style.visibility = "visible";
  };
}
function prepareVideos() {
  if (!adUrls.length) return;
  preloadVideo(videoEls[0], adUrls[getIndex(-1)]);
  preloadVideo(videoEls[1], adUrls[getIndex(0)]);
  preloadVideo(videoEls[2], adUrls[getIndex(1)]);
  wrapper.style.transition = "none";
  wrapper.style.transform = "translateX(-100%)";
}

function showCenterIcon(type) {
  const iconWrap = document.getElementById("video-center-icon");
  const icon = document.getElementById("play-pause-icon");
  if (type === "play") {
    icon.className = "fas fa-play";
  } else {
    icon.className = "fas fa-pause";
  }
  iconWrap.classList.remove("show"); // 재실행 위해
  void iconWrap.offsetWidth; // reflow
  iconWrap.style.display = "block";
  iconWrap.classList.add("show");
  setTimeout(() => {
    iconWrap.classList.remove("show");
    iconWrap.style.display = "none";
  }, 1200);
}

function togglePlayPause(e) {
  const video = e.currentTarget;
  if (video.paused) {
    videoStartTime = Date.now();
    video.play();
    showCenterIcon("play");
  } else {
    if (videoStartTime) {
      accumulatedWatchMs += Date.now() - videoStartTime;
      videoStartTime = null;
    }
    video.pause();
    showCenterIcon("pause");
  }
}
// 2. playCenterVideo에서 removeEventListener로 먼저 제거 후 addEventListener
function playCenterVideo() {
  if (!adUrls.length) return;
  const center = videoEls[1];
  center.pause();
  center.currentTime = 0;
  accumulatedWatchMs = 0; // 새 영상 시작 시 누적 시간 초기화
  center.play();
  videoStartTime = Date.now();
  center.onended = () => slideToNext();

  // 기존 클릭 이벤트 제거 후 다시 등록 (중복 방지)
  center.removeEventListener("click", togglePlayPause);
  center.addEventListener("click", togglePlayPause);

  // 마우스 커서 포인터로 변경
  center.style.cursor = "pointer";
}
function rotateVideos(direction) {
  if (direction === "next") {
    const temp = videoEls.shift();
    videoEls.push(temp);
  } else {
    const temp = videoEls.pop();
    videoEls.unshift(temp);
  }
  videoEls.forEach(v => wrapper.appendChild(v));
  prepareVideos();
  playCenterVideo();
}
let isTransitioning = false;
document.getElementById("leftBtn").addEventListener("click", slideToPrev);
document.getElementById("rightBtn").addEventListener("click", slideToNext);

function updateClock() {
  const now = new Date();
  const pad = n => n.toString().padStart(2, '0');
  const time = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  document.getElementById('clock').textContent = time;
}
setInterval(updateClock, 1000);
updateClock();

let videoStartTime = null;
let lastWatchSec = 0;
let accumulatedWatchMs = 0; // 누적 시청 시간(ms)
function updateWatchTime(sec) {
    lastWatchSec = sec;
    const row = adRows[getIndex(0)]; // 현재 광고의 행 번호
    document.getElementById("watchTime").textContent = `${row} 영상 시청 시간: ${sec}초`;
    if (typeof socket !== 'undefined' && socket.connected) {
        socket.emit("watch_time", { sec: sec, row: row });
    }
}


function slideToNext() {
  if (isTransitioning) return;
  let watchedMs = accumulatedWatchMs;
  if (videoStartTime) {
    watchedMs += Date.now() - videoStartTime;
    videoStartTime = null;
  }
  if (watchedMs > 0) {
    const watchedSec = (watchedMs / 1000).toFixed(1);
    updateWatchTime(watchedSec);
  }
  accumulatedWatchMs = 0;
  isTransitioning = true;
  wrapper.style.transition = "transform 0.5s ease-in-out";
  wrapper.style.transform = "translateX(-200%)";
  setTimeout(() => {
    currentIndex = getIndex(1);
    rotateVideos("next");
    isTransitioning = false;
  }, 500);
}

function slideToPrev() {
  if (isTransitioning) return;
  let watchedMs = accumulatedWatchMs;
  if (videoStartTime) {
    watchedMs += Date.now() - videoStartTime;
    videoStartTime = null;
  }
  if (watchedMs > 0) {
    const watchedSec = (watchedMs / 1000).toFixed(1);
    updateWatchTime(watchedSec);
  }
  accumulatedWatchMs = 0;
  isTransitioning = true;
  wrapper.style.transition = "transform 0.5s ease-in-out";
  wrapper.style.transform = "translateX(0%)";
  setTimeout(() => {
    currentIndex = getIndex(-1);
    rotateVideos("prev");
    isTransitioning = false;
  }, 500);
}

// 마우스 드래그 지원
let dragStartX = null;
let dragging = false;
wrapper.addEventListener("mousedown", (e) => {
  if (isTransitioning) return;
  dragging = true;
  dragStartX = e.clientX;
  wrapper.style.transition = "none";
});
document.addEventListener("mousemove", (e) => {
  if (!dragging) return;
  const deltaX = e.clientX - dragStartX;
  wrapper.style.transform = `translateX(calc(-100% + ${deltaX}px))`;
});
document.addEventListener("mouseup", (e) => {
  if (!dragging) return;
  dragging = false;
  const deltaX = e.clientX - dragStartX;
  const threshold = wrapper.offsetWidth / 4;
  if (deltaX < -threshold) {
    slideToNext();
  } else if (deltaX > threshold) {
    slideToPrev();
  } else {
    wrapper.style.transition = "transform 0.3s";
    wrapper.style.transform = "translateX(-100%)";
  }
});

// WebSocket: 서버에서 광고 URL 배열 동적 수신!
const socket = io();
socket.on('connect', () => {
  console.log('WebSocket 연결됨');
});
socket.on('ads_urls', (data) => {
  if (data.ads && Array.isArray(data.ads) && data.ads.length > 0) {
    adUrls = data.ads.map(ad => ad.AISAC_URL);
    adRows = data.ads.map(ad => ad['행 번호']);
    currentIndex = 0;
    prepareVideos();
    playCenterVideo();
    console.log('서버에서 광고 목록 갱신:', adUrls, adRows);

    // 광고 대기열 시각화 
    renderAdQueue();
  }

  // ★ mid_scores를 받아 그래프 그리기
  // ★ mid_scores를 받아 누적 그래프 그리기
  if (data.mid_scores && Array.isArray(data.mid_scores)) {
    const container = document.getElementById("preferenceBars");
    container.innerHTML = ""; // 기존 그래프 초기화

    const colors = ["#f4c542", "#6aa84f", "#3c78d8", "#e06666", "#b0b0b0", "#f78da7"];

    data.mid_scores.forEach((score, i) => {
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.style.width = `${score["비율"]}%`;
      bar.style.height = "100%";
      bar.style.background = colors[i % colors.length];
      bar.style.display = "flex";
      bar.style.flexDirection = "column";
      bar.style.justifyContent = "center";
      bar.style.alignItems = "center";
      bar.style.fontSize = "0.75rem";
      bar.style.fontWeight = "bold";
      bar.style.color = "#fff";
      bar.title = score["중업종 분류"];

      bar.innerHTML = `
        <div>${score["중업종 분류"]}</div>
        <div>${score["비율"].toFixed(1)}%</div>
      `;

      container.appendChild(bar);
    });
  }
});

// 광고 대기열을 시각적으로 표시하는 함수 추가
function renderAdQueue() {
  const adQueueList = document.getElementById('ad-queue-list');
  if (!adQueueList) return;
  adQueueList.innerHTML = '';
  adUrls.forEach((url, idx) => {
    const li = document.createElement('li');
    li.innerHTML = `<b>광고 ID:</b> ${adRows[idx]}<br><span style="font-size:0.9em;color:#888;">${url}</span>`;
    adQueueList.appendChild(li);
  });
}
// 광고대기열 탭 클릭 시에도 광고 대기열을 다시 렌더링
document.querySelector('label[for="tab-radio-ad"]').addEventListener('click', () => {
  renderAdQueue();
});

document.addEventListener('DOMContentLoaded', () => {
    const modal = document.getElementById('user-info-modal');
    const form = document.getElementById('user-info-form');
    const mainContent = document.querySelector('.main-content');
    const declinePrivacy = document.getElementById('decline-privacy');

    // 개인정보 제공 동의하지 않을 경우
    declinePrivacy.addEventListener('click', () => {
        modal.style.display = 'none';
        mainContent.style.display = 'flex';
        socket.emit('request_ads');
    });

    // 서버에 user_config.json 존재 여부 확인 요청
    socket.emit('check_user_config');

    socket.on('user_config_exists', (data) => {
        if (data.exists) {
            // 파일이 있으면 바로 광고 추천 요청
            modal.style.display = 'none';
            mainContent.style.display = 'flex';
            socket.emit('request_ads');
        } else {
            // 없으면 사용자 정보 입력 모달 표시
            modal.style.display = 'flex';
        }
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const gender = document.getElementById('gender').value;
        const age = document.getElementById('age').value;
        if (gender && age) {
            if (typeof socket !== 'undefined' && socket.connected) {
                socket.emit('user_info', { gender, age });
                console.log('User info sent:', { gender, age });
                socket.emit('request_ads');
            }

            modal.style.display = 'none';
            mainContent.style.display = 'flex';
        }
    });
});


</script>
